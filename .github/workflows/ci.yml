name: CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22.19.0", "24"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # PPL Core is a pinned build-time compiler only; it is not vendored in
      # the distributed plugin. The generated IR is the runtime input.
      - uses: actions/checkout@v4
        with:
          repository: clonetimer/PPL
          ref: a587e5b6ffb62fd005ac67e98eed79fac3dd66de
          path: .ppl-toolchain
      - name: Build pinned PPL compiler
        run: |
          npm install --prefix .ppl-toolchain/components/foundation/core --no-audit --no-fund
          npm run build --prefix .ppl-toolchain/components/foundation/core
      - name: Diagnose DeepSeek Whale PPL source
        run: |
          node --input-type=module -e "import { compileFile } from './.ppl-toolchain/components/foundation/core/dist/src/fs-project.js'; const r=compileFile('personas/deepseek-whale.ppl',{moduleRoot:'.ppl-toolchain/components/foundation/core/modules'}); console.log(JSON.stringify(r.diagnostics,null,2));"
      - name: Compile and test DeepSeek Whale persona
        run: |
          node .ppl-toolchain/components/foundation/core/dist/src/cli.js check personas/deepseek-whale.ppl --module-root .ppl-toolchain/components/foundation/core/modules
          node .ppl-toolchain/components/foundation/core/dist/src/cli.js test personas/deepseek-whale.ppl --module-root .ppl-toolchain/components/foundation/core/modules
          mkdir -p .ppl-artifacts
          node .ppl-toolchain/components/foundation/core/dist/src/cli.js build personas/deepseek-whale.ppl --module-root .ppl-toolchain/components/foundation/core/modules --out .ppl-artifacts/deepseek-whale.pir.json
          if [ -f personas/deepseek-whale.pir.json ]; then
            cmp personas/deepseek-whale.pir.json .ppl-artifacts/deepseek-whale.pir.json
          else
            cp .ppl-artifacts/deepseek-whale.pir.json personas/deepseek-whale.pir.json
          fi
      - name: Commit generated DeepSeek Whale PPL IR
        if: matrix.node == '22.19.0'
        run: |
          if ! git ls-files --error-unmatch personas/deepseek-whale.pir.json >/dev/null 2>&1 || ! cmp -s personas/deepseek-whale.pir.json .ppl-artifacts/deepseek-whale.pir.json; then
            cp .ppl-artifacts/deepseek-whale.pir.json personas/deepseek-whale.pir.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add personas/deepseek-whale.pir.json
            git commit -m "build: update compiled DeepSeek Whale PPL IR"
            TARGET_BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
            git fetch origin "$TARGET_BRANCH"
            git rebase "origin/$TARGET_BRANCH"
            git push origin "HEAD:$TARGET_BRANCH"
          fi
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        with:
          name: deepseek-whale-pir-node-${{ matrix.node }}
          path: .ppl-artifacts/deepseek-whale.pir.json
          if-no-files-found: error
