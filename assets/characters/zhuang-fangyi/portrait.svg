<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 560" role="img" aria-labelledby="title desc">
<title id="title">庄方宜 Q版角色立绘</title>
<desc id="desc">原创 Q 版概念形象：深色长发、金色角饰、黑白礼装与金色细节，透明背景。</desc>
<defs>
  <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#28364e"/><stop offset=".48" stop-color="#111c32"/><stop offset="1" stop-color="#52617a"/></linearGradient>
  <linearGradient id="hairHi" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8ea5c0"/><stop offset=".5" stop-color="#293d5d"/><stop offset="1" stop-color="#a5b7c9"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff1b1"/><stop offset=".45" stop-color="#d6a84e"/><stop offset="1" stop-color="#8b5a20"/></linearGradient>
  <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffef8"/><stop offset=".55" stop-color="#d9e0e8"/><stop offset="1" stop-color="#8f9aaa"/></linearGradient>
  <linearGradient id="coat" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#28354c"/><stop offset="1" stop-color="#090f20"/></linearGradient>
  <radialGradient id="skin"><stop stop-color="#ffe8dc"/><stop offset="1" stop-color="#e8bfb2"/></radialGradient>
  <filter id="shadow" x="-30%" y="-20%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter>
</defs>
